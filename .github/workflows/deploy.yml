
name: Programme Planner CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programme-planner-test
  cancel-in-progress: false

jobs:
  pipeline:
    uses: Holden-Installations/shared-workflows/.github/workflows/monday-deploy.yml@main
    with:
      app_version_id: '20757899'
    secrets:
      MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
